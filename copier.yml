# copier.yml
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: "Project Name (e.g. my-tool)"
  # 或者是中文版，必须加引号：
  # help: "项目名称 (例如: my-tool)"

description:
  type: str
  help: "Description"
  default: "A tool developed with modern Python stack."

author_name:
  type: str
  help: "Author Name"
  default: "zhouxin"

author_email:
  type: str
  help: "Author Email"
  default: "zhou.xin@mail.ustc.edu.cn"

python_version:
  type: str
  help: "Python Version"
  default: "3.12"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') | lower }}"
